<div class="flex flex-col gap-6">
  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-(--color-text-primary)">Categorias</h2>
    <button
      (click)="openCreate()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-(--radius-input) bg-(--color-btn-primary-bg) text-(--color-btn-primary-text) text-sm font-medium hover:bg-(--color-btn-primary-hover) transition-all"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nova Categoria
    </button>
  </div>

  <!-- TABLE -->
  <div
    class="rounded-(--radius-card) border border-(--color-border) bg-bg-card overflow-hidden"
  >
    <table class="w-full text-sm">
      <thead>
        <tr
          class="text-left text-[10px] uppercase tracking-wider text-(--color-text-muted) border-b border-(--color-border)"
        >
          <th class="px-5 py-3 font-medium">Nome</th>
          <th class="px-5 py-3 font-medium text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr>
            <td colspan="2" class="px-5 py-6 text-center text-(--color-text-muted) text-xs">
              Carregando...
            </td>
          </tr>
        } @else {
          @for (category of categories(); track category.id) {
            <tr class="border-b border-(--color-border) last:border-0">
              <td class="px-5 py-4 font-medium text-(--color-text-primary)">{{ category.name }}</td>
              <td class="px-5 py-4">
                <div class="flex items-center justify-end gap-2">
                  <button
                    (click)="openEdit(category)"
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-(--color-text-muted) hover:bg-(--color-bg-hover) hover:text-(--color-text-primary) transition-all"
                    aria-label="Editar categoria"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z" />
                    </svg>
                  </button>
                  <button
                    (click)="remove(category)"
                    class="w-8 h-8 flex items-center justify-center rounded-lg text-(--color-text-muted) hover:bg-danger-subtle hover:text-(--color-danger) transition-all"
                    aria-label="Excluir categoria"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <polyline points="3 6 5 6 21 6" />
                      <path
                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                      />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="px-5 py-6 text-center text-(--color-text-muted) text-xs">
                Nenhuma categoria cadastrada
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>

<app-modal-edit-entity
  [title]="modalTitle()"
  [show]="showModal()"
  [entity]="entity"
  [fields]="fields"
  (close)="closeModal()"
  (save)="saveEntity($event)"
/>
